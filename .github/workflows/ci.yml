name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

env:
  MAVEN_OPTS: -Xmx2g
  # Codecov only ingests coverage for main pushes and PRs targeting main; jacoco's
  # report generation is skipped everywhere else since nothing would consume it.
  UPLOAD_COVERAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: ecuacion-tools

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/exclude-windows-defender@main

      # Install dependencies in order (ecuacion-lib → ecuacion-utils → ecuacion-splib)
      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-lib
          path: ecuacion-lib
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-utils
          path: ecuacion-utils
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/install-ecuacion-dependency@main
        with:
          repository: ecuacion-jp/ecuacion-splib
          path: ecuacion-splib
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || (github.ref_name == 'main' && 'main' || 'develop') }}

      - name: Verify (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ecuacion-tools
        run: |
          if [ "$UPLOAD_COVERAGE" = "true" ]; then
            mvn verify -Dwagon.skip=true -Dallure.report.skip=true -Dlicense.skip=true -e
          else
            mvn verify -Dwagon.skip=true -Dallure.report.skip=true -Dlicense.skip=true -Djacoco.skip=true -e
          fi

      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        working-directory: ecuacion-tools
        run: mvn test -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true -Djacoco.skip=true -e

      - uses: ecuacion-jp/ecuacion-lib/.github/actions/upload-coverage@main
        if: matrix.os == 'ubuntu-latest' && env.UPLOAD_COVERAGE == 'true'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            ecuacion-tools/ecuacion-tool-command-api/target/site/jacoco/jacoco.xml,
            ecuacion-tools/ecuacion-tool-housekeep-db/target/site/jacoco/jacoco.xml,
            ecuacion-tools/ecuacion-tool-housekeep-files/target/site/jacoco/jacoco.xml
