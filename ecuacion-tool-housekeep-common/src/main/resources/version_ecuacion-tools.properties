# Read by ecuacion-references-tools' navbar version badge
# (VersionUtil.getVersion("ecuacion-tools")), as a stand-in for an "ecuacion-tools" product
# version, which doesn't otherwise exist since each ecuacion-tool-* module here is versioned
# independently. Kept as its own version_<productName>.properties file (rather than the
# unsuffixed version.properties convention) because a consuming app may also carry its own
# unsuffixed version.properties for its own app version, and both would collide on the
# classpath under the same name.
version=@project.version@
