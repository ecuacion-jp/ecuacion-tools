# This file lives under src/main/webapp/WEB-INF/classes (packaged straight into the WAR's
# WEB-INF/classes by maven-war-plugin) rather than src/main/resources, so that it never
# lands on Eclipse's own dev-time classpath alongside src/envs/local/resources -- both are
# wired as raw source folders onto the same output folder in .classpath, and a file named
# application.properties in both would collide silently.
#
# To place an environment-specific application.properties / ecuacion-tool-command-api-
# scripts.properties (or .yml) outside this WAR when deployed to an existing Tomcat, put it
# under:
#
#   ${catalina.base}/app-conf/ecuacion-tool-command-api/
#     (e.g. /usr/local/tomcat/app-conf/ecuacion-tool-command-api/)
#
# This directory doesn't need to exist beforehand -- if it's missing, nothing is imported and
# this WAR's own embedded configuration (application-builtin.properties) is used as-is. Keys
# found there take precedence over application-builtin.properties. WebApplication.java also
# adds "ecuacion-tool-command-api-scripts" to spring.config.name, so files by that name are
# looked up here too, alongside application.properties/.yml. A logback-spring.xml placed in the
# same directory is also picked up (see SplibEnvironmentPostProcessor in ecuacion-splib-core),
# without needing the shared, Tomcat-process-wide -Dlogging.config.
#
# The directory can be redirected per deployment, without repackaging the WAR, via the
# jp.ecuacion.tool.command-api.app-conf-dir system property (e.g. in Tomcat's setenv.sh):
#
#   CATALINA_OPTS="$CATALINA_OPTS -Djp.ecuacion.tool.command-api.app-conf-dir=/path/to/config/dir"
#
# catalina.base falls back to "." when unset (e.g. when this WAR is run as an executable
# war/jar with an embedded container rather than deployed to an external Tomcat).
jp.ecuacion.splib.core.app-conf-dir=${jp.ecuacion.tool.command-api.app-conf-dir:${catalina.base:.}/app-conf/ecuacion-tool-command-api}
spring.config.import=optional:file:${jp.ecuacion.splib.core.app-conf-dir}/
